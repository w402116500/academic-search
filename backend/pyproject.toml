[project]
name = "academic-search-backend"
version = "0.1.0"
description = "Backend dependencies and developer tooling for academic-search."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "arq>=0.26,<1",
  "asyncpg>=0.30,<1",
  "boto3>=1.36,<2",
  "citeproc-py>=0.9,<1",
  "citeproc-py-styles>=0.1,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain>=1.0,<2",
  "langchain-openai>=0.3,<2",
  "langgraph>=1.0,<2",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5.0,<7",
  "pymilvus>=2.5,<3",
  "pybtex>=0.25,<1",
  "redis>=5.2,<7",
  "sqlalchemy>=2.0,<3",
  "tiktoken>=0.8,<1",
  "uvicorn[standard]>=0.34,<1",
  "argon2-cffi>=23.1,<26",
  "pyjwt>=2.10,<3",
  "email-validator>=2.2,<3",
  "langgraph-checkpoint-postgres>=2,<4",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
  "pre-commit>=4.0,<5",
  "pyright>=1.1.396,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# 测试进程共享 SQLAlchemy asyncpg 引擎；统一事件循环避免连接池复用已关闭循环中的连接。
asyncio_default_test_loop_scope = "session"
markers = [
  "live: 使用真实外部学术 API 和本地 .env 的集成测试。",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["app", "tests"]
exclude = [".venv", "alembic"]
reportMissingImports = true
reportMissingTypeStubs = false
